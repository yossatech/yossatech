<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yossa Tech · Portal de Gestión</title>
<meta name="theme-color" content="#0F3B2D">
<meta name="description" content="Portal administrativo de Yossa Tech — Sistema de gestión integral">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --c1:#0F3B2D;--c2:#1A7B5C;--c3:#2CC295;
  --gold:#C4A43C;--gold-light:#E8D98A;
  --dark:#0A1F15;--darker:#061209;
  --white:#F8FAF9;--gray:#9EAAA4;--gray-light:#D1DAD5;
  --radius:14px;--radius-sm:8px;
  --shadow:0 8px 32px rgba(10,31,21,.28);
  --shadow-sm:0 4px 16px rgba(10,31,21,.18);
  --grad:linear-gradient(135deg,var(--c1) 0%,var(--c2) 50%,var(--c3) 100%);
  --grad-dark:linear-gradient(160deg,var(--darker) 0%,var(--dark) 40%,var(--c1) 100%);
  --font:'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%;font-family:var(--font);background:var(--grad-dark);color:var(--white);overflow:hidden}
body{display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0) 16px env(safe-area-inset-bottom,0)}

/* ===== Circuit board pattern background ===== */
.bg-pattern{position:fixed;inset:0;z-index:0;opacity:.06;pointer-events:none;
  background-image:
    linear-gradient(var(--c3) 1px,transparent 1px),
    linear-gradient(90deg,var(--c3) 1px,transparent 1px),
    radial-gradient(circle 3px,var(--c3) 1px,transparent 1px);
  background-size:60px 60px,60px 60px,60px 60px;
  background-position:0 0,0 0,30px 30px}

/* ===== Animated glow ===== */
.glow{position:fixed;width:600px;height:600px;border-radius:50%;filter:blur(120px);opacity:.12;z-index:0;animation:pulse 8s ease-in-out infinite alternate}
.glow-1{background:var(--c2);top:-200px;left:-100px}
.glow-2{background:var(--c3);bottom:-250px;right:-150px;animation-delay:4s}
@keyframes pulse{0%{transform:scale(1)}100%{transform:scale(1.15)}}

/* ===== Login card ===== */
.login-card{position:relative;z-index:10;width:100%;max-width:420px;
  background:rgba(15,59,45,.65);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(44,194,149,.18);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden}
.login-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad)}
.card-header{padding:32px 28px 20px;text-align:center}
.logo-wrap{margin-bottom:16px}
.logo-wrap img{max-width:220px;height:auto;filter:drop-shadow(0 2px 8px rgba(0,0,0,.3))}
.card-header h1{font-size:1.05rem;font-weight:600;color:var(--gray-light);letter-spacing:.04em}
.card-header .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--c3);margin:0 8px;vertical-align:middle;box-shadow:0 0 8px var(--c3);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:.4}50%{opacity:1}}
.card-body{padding:4px 28px 28px}

/* ===== Form elements ===== */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:.78rem;font-weight:500;color:var(--gray);text-transform:uppercase;letter-spacing:.06em}
.field input{width:100%;padding:13px 16px;font-size:1.15rem;font-family:var(--font);
  background:rgba(10,31,21,.6);border:1px solid rgba(44,194,149,.25);border-radius:var(--radius-sm);
  color:var(--white);outline:none;transition:border-color .2s,box-shadow .2s;
  letter-spacing:.12em;text-align:center}
.field input::placeholder{color:var(--gray);letter-spacing:.05em;font-size:.9rem}
.field input:focus{border-color:var(--c3);box-shadow:0 0 0 3px rgba(44,194,149,.15)}

.btn{display:block;width:100%;padding:14px;font-size:1rem;font-weight:700;font-family:var(--font);
  border:none;border-radius:var(--radius-sm);cursor:pointer;transition:all .2s;letter-spacing:.03em}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 4px 18px rgba(26,123,92,.35)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(26,123,92,.45)}
.btn-primary:active{transform:translateY(0);box-shadow:0 2px 10px rgba(26,123,92,.3)}

/* ===== Alert boxes ===== */
.alert{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:var(--radius-sm);
  font-size:.82rem;line-height:1.45;margin-bottom:16px}
.alert-info{background:rgba(44,194,149,.1);border:1px solid rgba(44,194,149,.2);color:var(--gray-light)}
.alert-warn{background:rgba(196,164,60,.1);border:1px solid rgba(196,164,60,.25);color:var(--gold-light)}
.alert-err{background:rgba(220,53,69,.1);border:1px solid rgba(220,53,69,.25);color:#f8aaaa}
.alert .em{font-size:1.2rem;flex-shrink:0;margin-top:1px}

/* ===== Toast ===== */
.toast-wrap{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999}
.toast{padding:10px 18px;border-radius:var(--radius-sm);font-size:.85rem;font-weight:600;
  background:rgba(15,59,45,.92);border:1px solid rgba(44,194,149,.3);color:var(--white);
  backdrop-filter:blur(12px);box-shadow:var(--shadow-sm);animation:toastIn .35s ease}
@keyframes toastIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}

/* ===== Footer ===== */
.card-footer{padding:12px 28px 18px;text-align:center;font-size:.72rem;color:var(--gray);border-top:1px solid rgba(44,194,149,.1)}

/* ===== Links ===== */
a{color:var(--c3);text-decoration:none;font-weight:600}
a:hover{text-decoration:underline}

/* ===== Responsive ===== */
@media(max-width:480px){
  .login-card{border-radius:var(--radius-sm);margin:0 4px}
  .card-header,.card-body{padding-left:20px;padding-right:20px}
  .logo-wrap img{max-width:180px}
}
</style>
</head>

// ====== SUPABASE ======
const SUPA = { url: 'https://muvbocrwuumyofzeegol.supabase.co', key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11dmJvY3J3dXVteW9memVlZ29sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2NTU0MjAsImV4cCI6MjEwNzIzMTQyMH0.K4K3gSBerILasggKGy9WUf3xCCLKRdi-L9BmULboMC8' };

// ====== STATE ======
let v10Code = null, v10Exp = 0, v10Tries = 0, v10User = null, v10Mode = 'supa';

// ====== TOAST ======
function toast(msg, em) {
  const w = document.getElementById('toastWrap');
  w.innerHTML = `<div class="toast">${em || ''} ${msg}</div>`;
  setTimeout(() => w.innerHTML = '', 3500);
}

// ====== STEP 1: Ask for access code ======
function stepAccessCode() {
  v10Code = null; v10Exp = 0; v10Tries = 0; v10User = null;
  document.getElementById('cardBody').innerHTML = `
    <div class="alert alert-info">
      <span class="em">🔐</span>
      <div>Ingresa tu <strong>código de acceso</strong> para entrar al portal administrativo.</div>
    </div>
    <div class="field">
      <label>Código de acceso</label>
      <input type="password" id="inputCode" placeholder="••••••••" autocomplete="current-password"
        onkeydown="if(event.key==='Enter')validateCode()">
    </div>
    <button class="btn btn-primary" onclick="validateCode()">Continuar</button>`;
  setTimeout(() => { const i = document.getElementById('inputCode'); if(i) i.focus(); }, 100);
}

// ====== VALIDATE CODE & SEND OTP ======
function validateCode() {
  const code = (document.getElementById('inputCode')?.value || '').trim();
  if (!code) return toast('Escribe el código de acceso', '⚠️');

  const user = YOSSA.users.find(u => u.pin === code || u.pin === code.toLowerCase());
  if (!user) return toast('Código de acceso incorrecto', '🚫');

  v10User = user;
  sendOTP();
}

// ====== SEND OTP (Supabase Auth; si falla, respaldo por FormSubmit) ======
function otpMsg(html) { const m = document.getElementById('otpMsg'); if (m) m.innerHTML = html; }

async function sendOTP() {
  v10Tries = 0; v10Code = null;
  stepVerifyOTP();
  otpMsg('Enviando código…');
  try {
    const r = await fetch(SUPA.url + '/auth/v1/otp', {
      method: 'POST',
      headers: { apikey: SUPA.key, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: YOSSA.email, create_user: false })
    });
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.msg || j.error_description || ('HTTP ' + r.status)); }
    v10Mode = 'supa';
    otpMsg('✅ Revisa la bandeja de entrada y el spam.');
  } catch (e) {
    // Respaldo: código local por FormSubmit (no crea sesión de nube)
    v10Mode = 'local';
    v10Code = String(Math.floor(100000 + Math.random() * 900000));
    v10Exp = Date.now() + 10 * 60 * 1000;
    fetch('https://formsubmit.co/ajax/' + encodeURIComponent(YOSSA.email), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify({ _subject: '🔐 Código de acceso · ' + YOSSA.biz, _template: 'table', _captcha: 'false',
        'Usuario': v10User.nombre, 'Perfil': v10User.perfil, 'Código': v10Code, 'Vence': 'en 10 minutos', 'Fecha': new Date().toLocaleString('es-CO') })
    }).then(r => otpMsg(r.ok ? '✅ Revisa la bandeja de entrada y el spam.' : '⚠️ El correo no respondió. Usa el <strong>código de respaldo</strong>.'))
      .catch(() => otpMsg('⚠️ No se pudo enviar. Usa el <strong>código de respaldo</strong>.'));
  }
}

// ====== STEP 2: Verify OTP ======
function stepVerifyOTP() {
  const maskedEmail = YOSSA.email.replace(/(.{2})(.*)(@.*)/, '$1***$3');
  document.getElementById('cardBody').innerHTML = `
    <div class="alert alert-info">
      <span class="em">✉️</span>
      <div>Enviamos un código de <strong>6 dígitos</strong> a <strong>${maskedEmail}</strong>. Vence en 10 minutos.</div>
    </div>
    <div class="field">
      <label>Código de verificación</label>
      <input type="text" id="inputOTP" inputmode="numeric" maxlength="8" placeholder="• • • • • •"
        autocomplete="one-time-code" style="font-size:1.5rem;letter-spacing:.4em;font-weight:700"
        onkeydown="if(event.key==='Enter')verifyOTP()">
    </div>
    <button class="btn btn-primary" onclick="verifyOTP()">Verificar y entrar</button>
    <div id="otpMsg" style="margin-top:10px;font-size:.78rem;color:var(--gray);text-align:center">Enviando código…</div>
    <div style="margin-top:12px;display:flex;justify-content:space-between;font-size:.78rem">
      <a href="#" onclick="event.preventDefault();sendOTP()">Reenviar código</a>
      <a href="#" onclick="event.preventDefault();stepAccessCode()">Cambiar código</a>
    </div>`;
  setTimeout(() => { const i = document.getElementById('inputOTP'); if(i) i.focus(); }, 100);
}

// ====== VERIFY OTP & REDIRECT ======
async function verifyOTP() {
  const input = (document.getElementById('inputOTP')?.value || '').trim().toUpperCase();
  if (!input) return toast('Escribe el código', '⚠️');
  if (++v10Tries > 5) { toast('Demasiados intentos', '🚫'); return stepAccessCode(); }

  const okResp = input === YOSSA.codigoRespaldo.toUpperCase() && v10User.perfil === 'gerencia';
  let okCode = false;

  if (!okResp && v10Mode === 'supa') {
    try {
      const r = await fetch(SUPA.url + '/auth/v1/verify', {
        method: 'POST',
        headers: { apikey: SUPA.key, 'Content-Type': 'application/json' },
        body: JSON.stringify({ type: 'email', email: YOSSA.email, token: input })
      });
      const j = await r.json().catch(() => ({}));
      if (r.ok && j.access_token) {
        okCode = true;
        // Sesión de nube lista para admin.html (mismo formato que usa el admin)
        try {
          localStorage.setItem('ep_supa_session', JSON.stringify({
            at: j.access_token, rt: j.refresh_token,
            exp: Date.now() + ((j.expires_in || 3600) - 60) * 1000,
            email: (j.user && j.user.email) || YOSSA.email
          }));
        } catch (e) {}
      }
    } catch (e) {}
  } else if (!okResp && v10Mode === 'local') {
    okCode = !!v10Code && Date.now() < v10Exp && input === v10Code;
  }

  if (!okCode && !okResp) return toast('Código incorrecto o vencido', '🚫');

  toast('Bienvenido, ' + v10User.nombre + ' 👋', '✅');
  try { localStorage.setItem('ef_session', JSON.stringify({ userId: v10User.id })); } catch (e) {}
  setTimeout(() => { window.location.href = 'admin.html'; }, 800);
}

// ====== INIT ======
stepAccessCode();
</script>
